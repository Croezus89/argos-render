# Rendery Blendera na wielu maszynach naraz. W tym repo nie ma żadnych naszych plików: skrypty pobierane są w trakcie z repo prywatnego
# (sekret PRYWATNE_REPO_TOKEN), a obrazki od razu wracają do repo prywatnego (gałąź render-wyniki). Uruchamianie tylko ręczne.
name: render
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'gałąź repo prywatnego ze skryptami i zadaniem'
        required: true
      zadanie:
        description: 'ścieżka pliku zadania JSON w repo prywatnym (albo puste, gdy podane „warianty”)'
        required: false
        default: ''
      warianty:
        description: 'zadanie wprost: JSON {"skrypt", "args", "warianty", opcjonalnie "katalogi"} albo jego base64 (także gzip); zastępuje plik zadania; nie trafia do logu'
        required: false
        default: ''
      maszyny:
        description: 'liczba maszyn (1–20)'
        required: true
        default: '4'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shardy: ${{ steps.p.outputs.shardy }}
    steps:
      - id: p
        run: |
          n=${{ inputs.maszyny }}; [ "$n" -ge 1 ] && [ "$n" -le 20 ] || n=4
          echo "shardy=$(python3 -c "import json;print(json.dumps(list(range($n))))")" >> $GITHUB_OUTPUT
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shardy) }}
    steps:
      - name: Zadanie (z wejścia „warianty” albo z pliku; w logu tylko liczby)
        id: z
        run: |
          python3 - <<'PY'
          import base64, gzip, json, os, re, sys
          wej = json.load(open(os.environ['GITHUB_EVENT_PATH'])).get('inputs') or {}
          sciezka = re.compile(r'^[A-Za-z0-9_./-]+$')
          ok = lambda p: isinstance(p, str) and sciezka.match(p) and '..' not in p and not p.startswith('/')
          def blad(m): print('BŁĄD zadania: ' + m); sys.exit(1)
          def wypisz(klucz, linie):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write(f'{klucz}<<KONIEC\n' + ''.join(l + '\n' for l in linie) + 'KONIEC\n')
          w, zad = (wej.get('warianty') or '').strip(), (wej.get('zadanie') or '').strip()
          if w:
              try:
                  if not w.startswith('{'):
                      b = base64.b64decode(w, validate=False); w = (gzip.decompress(b) if b[:2] == b'\x1f\x8b' else b).decode('utf-8')
                  z = json.loads(w)
                  assert isinstance(z, dict)
              except Exception as e: blad('wejście „warianty” to nie JSON ani base64 JSON (' + type(e).__name__ + ')')
              if not ok(z.get('skrypt')) or not z['skrypt'].endswith('.py'): blad('zła ścieżka „skrypt”')
              if not isinstance(z.get('warianty'), list) or not z['warianty'] or not all(isinstance(x, str) for x in z['warianty']): blad('„warianty” to nie lista napisów')
              if not all(isinstance(x, str) for x in z.get('args', [])): blad('„args” to nie lista napisów')
              kat = z.get('katalogi') or [os.path.dirname(os.path.dirname(z['skrypt']))]
              if not all(ok(k) for k in kat): blad('zła ścieżka w „katalogi”')
              json.dump(z, open(os.path.expanduser('~/zadanie.json'), 'w')); wypisz('wzorce', kat); print(f'zadanie z wejścia: wariantów {len(z["warianty"])}')
          else:
              if not ok(zad) or not zad.endswith('.json'): blad('brak wejścia „warianty” i złe/puste „zadanie”')
              wypisz('wzorce', [os.path.dirname(zad)]); print('zadanie z pliku')
          PY
      - name: Skrypty z repo prywatnego
        uses: actions/checkout@v4
        with:
          repository: Croezus89/Argos-Studios
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRYWATNE_REPO_TOKEN }}
          path: prywatne
          filter: blob:none
          sparse-checkout: ${{ steps.z.outputs.wzorce }}
          persist-credentials: false
      - name: Katalogi skryptu (zadanie z pliku)
        if: inputs.warianty == ''
        env:
          T: ${{ secrets.PRYWATNE_REPO_TOKEN }}
          ZADANIE: ${{ inputs.zadanie }}
        run: |
          cp "prywatne/$ZADANIE" ~/zadanie.json
          mapfile -t K < <(python3 -c "
          import json, os, re, sys
          z = json.load(open(os.path.expanduser('~/zadanie.json'))); kat = z.get('katalogi') or [os.path.dirname(os.path.dirname(z['skrypt']))]
          for k in kat:
              if not re.match(r'^[A-Za-z0-9_./-]+$', k) or '..' in k: sys.exit('zła ścieżka')
              print(k)")
          H="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$T" | base64 -w0)"
          git -C prywatne -c "http.https://github.com/.extraheader=$H" sparse-checkout add "${K[@]}" > /dev/null 2>&1 || { echo "sparse-checkout add: błąd"; exit 1; }
          echo "wariantów: $(python3 -c "import json,os;print(len(json.load(open(os.path.expanduser('~/zadanie.json')))['warianty']))"), katalogów skryptu: ${#K[@]}"
      - name: Blender 5.2.4 (z pamięci podręcznej)
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-5.2.4-linux-x64
      - if: steps.cache.outputs.cache-hit != 'true'
        run: mkdir -p ~/blender && curl -sSL https://download.blender.org/release/Blender5.2/blender-5.2.4-linux-x64.tar.xz | tar -xJ -C ~/blender
      - name: Tekstury Poly Haven CC0 (pamięć podręczna)
        id: tcache
        uses: actions/cache@v4
        with:
          path: ~/tekstury
          key: tekstury-polyhaven-1k-v1-${{ hashFiles('prywatne/**/zestaw/drzewo.py') }}
          restore-keys: tekstury-polyhaven-1k-v1-
      - name: Tekstury (kora drzew z drzewo.py + opcjonalne „tekstury” z zadania)
        run: |
          # Kora: każde tex='…' z generatora drzew (bez tego drzewo.py po cichu renderuje korę bez tekstury, inaczej niż lokalnie).
          # Zadanie może dodać {"tekstury": ["nazwa", …]} → ~/tekstury/<nazwa>_diff_1k.jpg i _nor_gl_1k.jpg (jak TEKSTURY w rosliny.py).
          mkdir -p ~/tekstury/kora
          pobierz() {   # $1 nazwa Poly Haven, $2 katalog docelowy
            for m in diff nor_gl; do f="$2/$1_${m}_1k.jpg"; [ -s "$f" ] && continue
              curl -sfSL --retry 3 -o "$f" "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/$1/$1_${m}_1k.jpg" || { echo "BŁĄD tekstury $1 ($m)"; exit 1; }
            done; }
          K=$( (cat prywatne/gry/*/*/blender/zestaw/drzewo.py 2>/dev/null || true) | (grep -oE "tex='[a-z0-9_]+'" || true) | sed "s/tex='//;s/'//" | sort -u)
          for n in $K; do pobierz "$n" ~/tekstury/kora; done
          D=$(python3 -c "
          import json, os, re, sys
          for n in json.load(open(os.path.expanduser('~/zadanie.json'))).get('tekstury', []):
              if not re.match(r'^[a-z0-9_]+$', n): sys.exit('zła nazwa tekstury')
              print(n)")
          for n in $D; do pobierz "$n" ~/tekstury; done
          # DRZEWO_TEKSTURY zawsze (czyta go tylko drzewo.py); TEKSTURY tylko na prośbę zadania, żeby nie zmienić innych renderów
          echo "DRZEWO_TEKSTURY=$HOME/tekstury" >> $GITHUB_ENV
          [ -n "$D" ] && echo "TEKSTURY=$HOME/tekstury" >> $GITHUB_ENV || true
          echo "tekstury: kora $(echo $K | wc -w), z zadania $(echo $D | wc -w)"
      - name: Render (bez wypisywania treści)
        run: |
          sudo apt-get install -y -q libxi6 libxkbcommon0 libxxf86vm1 libgl1 libegl1 >/dev/null 2>&1 || true
          cd prywatne
          python3 - ~/zadanie.json "${{ matrix.shard }}" "${{ inputs.maszyny }}" > ../polecenia.txt <<'PY'
          import json, sys
          z = json.load(open(sys.argv[1])); s, n = int(sys.argv[2]), int(sys.argv[3])
          for i, w in enumerate(z["warianty"]):
              if i % n == s:
                  print(json.dumps([z["skrypt"], f"../wynik/{i:03d}", *z.get("args", []), *(["--wariant", w] if w else [])]))
          PY
          mkdir -p ../wynik; ok=0; zle=0
          while read -r l; do
            skr=$(python3 -c "import json,sys;print(json.loads(sys.argv[1])[0])" "$l"); out=$(python3 -c "import json,sys;print(json.loads(sys.argv[1])[1])" "$l")
            mapfile -t reszta < <(python3 -c "import json,sys;[print(x) for x in json.loads(sys.argv[1])[2:]]" "$l")
            mkdir -p "$out"
            kod=0   # run: to bash -e -o pipefail, więc kod przez ||, a grep bez dopasowania z || true
            # 22.11: Blender kończy kodem 0 także po błędzie Pythona, więc „udany” = jest PNG; inaczej BLAD.txt (koniec logu) i wariant.txt,
            # żeby strojenie.py od razu zakończyło rundę z przyczyną zamiast czekać do czekaj_min
            ~/blender/blender-5.2.4-linux-x64/blender -b -t 0 -P "$skr" -- --out "$out" "${reszta[@]}" > "$out.log" 2>&1 || kod=$?
            if [ "$kod" = 0 ] && find "$out" -name '*.png' -print -quit | grep -q .; then ok=$((ok+1)); else
              zle=$((zle+1)); { echo "kod $kod, brak PNG"; { grep -E 'Error|Traceback|line [0-9]+' "$out.log" || true; } | tail -n 15; echo ---; tail -n 25 "$out.log"; } > "$out/BLAD.txt"
              if [ ! -f "$out/wariant.txt" ]; then python3 -c "import sys;a=sys.argv[1:];print(a[a.index('--wariant')+1] if '--wariant' in a else '{}')" "${reszta[@]}" > "$out/wariant.txt"; fi
              echo "BŁĄD wariantu $out:"; head -n 8 "$out/BLAD.txt"
            fi
            rm -f "$out.log"
          done < ../polecenia.txt
          echo "warianty: ok $ok, błąd $zle; rdzeni: $(nproc)"
      - name: Obrazki do repo prywatnego (gałąź render-wyniki)
        env:
          T: ${{ secrets.PRYWATNE_REPO_TOKEN }}
        run: |
          git config --global user.name render; git config --global user.email render@users.noreply.github.com
          mkdir w && cd w && git init -q && git remote add o "https://x-access-token:${T}@github.com/Croezus89/Argos-Studios.git"
          wyslij() {   # $1 gałąź, $2 katalog w gałęzi, $3 katalog z plikami, $4 opis; za każdym razem od świeżego czubka gałęzi (bez rebase), losowy odstęp
            for i in $(seq 1 25); do
              if git fetch -q --depth 1 o "$1" 2>/dev/null; then git checkout -q -f -B "w$i" FETCH_HEAD; else git switch -q -f --orphan "w$i"; fi
              mkdir -p "$2" && cp -r "$3/." "$2/" && git add -A "$2" && git commit -q -m "$4" || { echo "nic do wysłania"; return 0; }
              git push -q o "HEAD:$1" 2>/dev/null && { echo "wysłane (próba $i)"; return 0; }
              sleep $(( 1 + RANDOM % (3 + 2 * i) ))
            done; echo "nie wysłano"; return 1; }
          wyslij render-wyniki "wyniki/${{ github.run_id }}/${{ matrix.shard }}" ../wynik "render ${{ github.run_id }} shard ${{ matrix.shard }}"
