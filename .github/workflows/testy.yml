# Testy logiki gry na wielu maszynach naraz. W tym repo nie ma naszych plików: kod gry i skrypt uruchamiający pobierane są w trakcie z repo
# prywatnego (sekret PRYWATNE_REPO_TOKEN), a pełne logi testów od razu wracają do repo prywatnego (gałąź testy-wyniki, wyniki/<run_id>/).
# W logu tego przebiegu: tylko nazwy testów, OK/BŁĄD i sekundy. Uruchamianie tylko ręczne. Testy czasu (płynność) zostają poza Actions.
name: testy
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'gałąź albo commit repo prywatnego'
        required: true
      gra:
        description: 'katalog gry w repo prywatnym (z testy/komplet.sh)'
        required: true
      testy:
        description: '"logika" (bez testów czasu), "wszystkie" albo nazwy po przecinku; "@kontrola" = kontrola ujemna (MUSI dać BŁĄD)'
        required: true
        default: 'logika'
      maszyny:
        description: 'liczba maszyn (1–20)'
        required: true
        default: '4'
permissions:
  contents: read
env:
  GRA: ${{ inputs.gra }}
  WYB: ${{ inputs.testy }}
  N: ${{ inputs.maszyny }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shardy: ${{ steps.p.outputs.shardy }}
    steps:
      - id: p
        run: |
          [[ "$GRA" =~ ^[A-Za-z0-9_./-]+$ && "$GRA" != *..* && "$WYB" =~ ^[A-Za-z0-9_,@\ -]+$ ]] || { echo "złe wejście gra/testy"; exit 1; }
          [[ "$N" =~ ^[0-9]+$ && "$N" -ge 1 && "$N" -le 20 ]] || { echo "maszyny: 1–20"; exit 1; }
          echo "shardy=$(python3 -c "import json;print(json.dumps(list(range($N))))")" >> $GITHUB_OUTPUT
  testy:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # 23.11: obraz Playwright ma przeglądarki i ich zależności (start ok. 40 s); instalacja apt na gołej maszynie trwała 103–992 s.
    # Wersja obrazu = playwright-core z package-lock skanera; przy innej wersji krok przeglądarek instaluje je jak dawniej.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    # w kontenerze domyślna powłoka kroków to sh (dash): bez mapfile i [[ ]] (23.11, pierwszy przebieg padł po 57 s)
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shardy) }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Kod z repo prywatnego
        uses: actions/checkout@v5
        with:
          repository: Croezus89/Argos-Studios
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRYWATNE_REPO_TOKEN }}
          path: prywatne
          filter: blob:none
          sparse-checkout: |
            ${{ inputs.gra }}
            studio/wspolne
            studio/narzedzia
            archiwum/dostepnosc-narzedzia/skaner
          persist-credentials: false
      - name: Dodatkowe katalogi potrzebne testom (z testy/actions-sciezki.txt gry)
        env:
          T: ${{ secrets.PRYWATNE_REPO_TOKEN }}
        run: |
          bash prywatne/studio/narzedzia/actions-testy.sh --sciezki "$GRA" > ~/sciezki.txt; mapfile -t X < ~/sciezki.txt
          [ ${#X[@]} -eq 0 ] && { echo "katalogów: 0"; exit 0; }
          H="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$T" | base64 -w0)"
          git -C prywatne -c "http.https://github.com/.extraheader=$H" sparse-checkout add "${X[@]}" > /dev/null 2>&1 || { echo "sparse-checkout add: błąd"; exit 1; }
          echo "katalogów: ${#X[@]}"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Lista testów tej maszyny
        id: l
        run: |
          bash prywatne/studio/narzedzia/actions-testy.sh --lista "$GRA" "$WYB" "$SHARD" "$N" > ~/lista.txt
          echo "testów: $(wc -l < ~/lista.txt)"
          grep -q webkit ~/lista.txt && echo "webkit=1" >> $GITHUB_OUTPUT || true
      - name: Przeglądarki (obraz Playwright; instalacja tylko przy innej wersji playwright-core)
        run: |
          s=$(date +%s); P=/ms-playwright; echo "PLAYWRIGHT_BROWSERS_PATH=$P" >> $GITHUB_ENV; export PLAYWRIGHT_BROWSERS_PATH=$P
          cd prywatne/archiwum/dostepnosc-narzedzia/skaner && npm ci --no-audit --no-fund --silent > /dev/null 2>&1 || { echo "npm ci: błąd"; exit 1; }
          CLI=node_modules/playwright-core/cli.js; B="chromium"; [ "${{ steps.l.outputs.webkit }}" = 1 ] && B="chromium webkit"
          W=$(node -p "require('./node_modules/playwright-core/package.json').version"); Z="z obrazu"
          if [ "$W" != 1.63.0 ]; then Z="zainstalowane (playwright-core $W ≠ obraz 1.63.0: podnieś wersję obrazu w testy.yml)"
            node $CLI install $B > /dev/null 2>&1 || { echo "instalacja przeglądarek: błąd"; exit 1; }
            node $CLI install-deps $B > /dev/null 2>&1 || { echo "zależności przeglądarek: błąd"; exit 1; }; fi
          ln -sfn "$(ls -d $P/chromium-*/chrome-linux64/chrome | head -1)" $P/chromium && mkdir -p /opt && ln -sfn $P /opt/pw-browsers
          (apt-get update -qq && apt-get install -y -qq python3-numpy python3-pil ffmpeg) > /dev/null 2>&1 || echo "numpy/pillow/ffmpeg: błąd instalacji"
          echo "playwright-core $W, $(/opt/pw-browsers/chromium --version), przeglądarki $Z: $B, $(( $(date +%s) - s )) s"
      - name: Testy (w logu tylko nazwy i OK/BŁĄD)
        id: t
        run: |
          set +e; s=$(date +%s); mkdir -p "$HOME/wynik"
          bash prywatne/studio/narzedzia/actions-testy.sh "$GRA" "$WYB" "$SHARD" "$N" "$HOME/wynik"; k=$?
          echo "kod=$k" >> $GITHUB_OUTPUT
          { echo "ref $(git -C prywatne rev-parse HEAD)"; echo "maszyna $SHARD/$N, rdzeni $(nproc), $(. /etc/os-release; echo $PRETTY_NAME)"; echo "testy $(( $(date +%s) - s )) s, kod $k"; } > "$HOME/wynik/info.txt"
          echo "rdzeni $(nproc)"
      - name: Logi do repo prywatnego (gałąź testy-wyniki)
        if: always()
        env:
          T: ${{ secrets.PRYWATNE_REPO_TOKEN }}
        run: |
          git config --global user.name testy; git config --global user.email testy@users.noreply.github.com
          mkdir w && cd w && git init -q && git remote add o "https://x-access-token:${T}@github.com/Croezus89/Argos-Studios.git"
          mkdir ../wysylka; find "$HOME/wynik" -maxdepth 1 -type f \( -name '*.log' -o -name '*.wynik' -o -name '*.txt' \) -exec cp {} ../wysylka/ \; 2>/dev/null
          wyslij() {   # $1 gałąź, $2 katalog w gałęzi, $3 katalog z plikami, $4 opis; za każdym razem od świeżego czubka gałęzi (bez rebase), losowy odstęp
          for i in $(seq 1 25); do
          if git fetch -q --depth 1 o "$1" 2>/dev/null; then git checkout -q -f -B "w$i" FETCH_HEAD; else git switch -q -f --orphan "w$i"; fi
          mkdir -p "$2" && cp -R "$3/." "$2/" && git add -A "$2" && git commit -q -m "$4" || { echo "nic do wysłania"; return 0; }
          git push -q o "HEAD:$1" 2>/dev/null && { echo "wysłane (próba $i)"; return 0; }
          sleep $(( 1 + RANDOM % (3 + 2 * i) ))
          done; echo "nie wysłano"; return 1; }
          wyslij testy-wyniki "wyniki/${{ github.run_id }}/$SHARD" ../wysylka "testy ${{ github.run_id }} maszyna $SHARD"
      - name: Wynik maszyny
        if: steps.t.outputs.kod != '0'
        run: exit 1
  razem:
    needs: [plan, testy]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Podsumowanie wszystkich maszyn (tylko nazwy i OK/BŁĄD)
        env:
          T: ${{ secrets.PRYWATNE_REPO_TOKEN }}
        run: |
          set +e +o pipefail
          git config --global user.name testy; git config --global user.email testy@users.noreply.github.com
          mkdir w && cd w && git init -q && git remote add o "https://x-access-token:${T}@github.com/Croezus89/Argos-Studios.git"
          git fetch -q --depth 1 o testy-wyniki && git checkout -q -b testy-wyniki FETCH_HEAD || { echo "brak gałęzi testy-wyniki"; exit 1; }
          D="wyniki/${{ github.run_id }}"; m=$(ls -d "$D"/*/ 2>/dev/null | wc -l)
          cat "$D"/*/publiczne.txt 2>/dev/null | grep -E '^(OK|BŁĄD|POMINIĘTY|BUILD)' | sort -k2 > ../razem.txt
          ok=$(grep -c '^OK' ../razem.txt); zle=$(grep -cvE '^OK' ../razem.txt)
          { echo "Przebieg ${{ github.run_id }}: OK $ok/$((ok+zle)), maszyn z wynikiem $m/$N"; cat ../razem.txt; } | tee "$D/RAZEM.txt"
          mkdir ../razem-w && cp "$D/RAZEM.txt" ../razem-w/
          wyslij() {   # $1 gałąź, $2 katalog w gałęzi, $3 katalog z plikami, $4 opis; za każdym razem od świeżego czubka gałęzi (bez rebase), losowy odstęp
          for i in $(seq 1 25); do
          if git fetch -q --depth 1 o "$1" 2>/dev/null; then git checkout -q -f -B "w$i" FETCH_HEAD; else git switch -q -f --orphan "w$i"; fi
          mkdir -p "$2" && cp -R "$3/." "$2/" && git add -A "$2" && git commit -q -m "$4" || { echo "nic do wysłania"; return 0; }
          git push -q o "HEAD:$1" 2>/dev/null && { echo "wysłane (próba $i)"; return 0; }
          sleep $(( 1 + RANDOM % (3 + 2 * i) ))
          done; echo "nie wysłano"; return 1; }
          wyslij testy-wyniki "$D" ../razem-w "testy ${{ github.run_id }} razem"
          [ "$zle" -eq 0 ] && [ "$m" -eq "$N" ] && [ "$ok" -gt 0 ]
